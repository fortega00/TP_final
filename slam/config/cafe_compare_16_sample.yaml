# Perfil experimental de Cafe; sin cambios en cafe.yaml.
map:
  resolution: 0.05
  width: 16.0
  height: 32.0
  origin_x: -8.0
  origin_y: -16.0
  prior: 0.5
sensor:
  p_hit: 0.7
  p_free: 0.35
  log_odds_min: -4.0
  log_odds_max: 4.0
  hit_thickness: 0.03
  min_range: 0.25
  max_range: 8.0
  max_beams: 180
  likelihood_beams: 60
  sigma_hit: 0.1
  z_hit: 0.95
  z_rand: 0.05
  likelihood_max_dist: 0.6
  likelihood_temperature: 1.0
  occupied_threshold: 0.65
  no_return_is_free: true
motion:
  alpha1: 0.0001
  alpha2: 1.0e-05
  alpha3: 0.0001
  alpha4: 0.0001
filter:
  particles: 16
  seed: 7
  resample_ess_ratio: 0.5
  initial_x: 0.0
  initial_y: 0.0
  initial_yaw: 0.0
  initial_std_xy: 0.0
  initial_std_yaw: 0.0
update:
  min_translation: 0.08
  min_rotation: 0.06
scan_match:
  enabled: true
  window_xy: 0.1
  step_xy: 0.025
  window_yaw: 0.06
  step_yaw: 0.01
  sigma: 0.05
  prior_xy: 0.05
  prior_yaw: 0.03
  sample_xy: 0.005
  sample_yaw: 0.005
  beams: 180
  effective_beams: 20.0
  min_occupied_cells: 200
