# Perfil real E16 elegido el 18/11/2026 (docs/decisiones/012-perfil-real-e16.md).
# Usar Numba para reproducir los tiempos medidos. Sensor/grilla del perfil real.
map:
  resolution: 0.05
  width: 48.0
  height: 40.0
  origin_x: -16.0
  origin_y: -20.0
  prior: 0.5
sensor:
  p_hit: 0.75
  p_free: 0.4
  log_odds_min: -4.0
  log_odds_max: 4.0
  hit_thickness: 0.08
  min_range: 0.12
  max_range: 8.0
  max_beams: 180
  likelihood_beams: 60
  sigma_hit: 0.15
  z_hit: 0.95
  z_rand: 0.05
  likelihood_max_dist: 0.6
  likelihood_temperature: 1.0
  occupied_threshold: 0.65
  # +inf on the real lidar is a missing echo, not free space.
  no_return_is_free: false
motion:
  # Only used until the map has enough cells to match against.
  alpha1: 0.003
  alpha2: 0.0003
  alpha3: 0.003
  alpha4: 0.003
filter:
  particles: 16
  seed: 7
  resample_ess_ratio: 0.5
  initial_x: 0.0
  initial_y: 0.0
  initial_yaw: 0.0
  initial_std_xy: 0.0
  initial_std_yaw: 0.0
update:
  min_translation: 0.08
  min_rotation: 0.06
  max_interval: 1.0
scan_match:
  enabled: true
  window_xy: 0.10
  step_xy: 0.025
  window_yaw: 0.06
  step_yaw: 0.01
  sigma: 0.05
  prior_xy: 0.05
  prior_yaw: 0.03
  sample_xy: 0.005
  sample_yaw: 0.005
  beams: 180
  effective_beams: 20.0
  min_occupied_cells: 200
