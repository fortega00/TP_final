# Cafe world from custom_map: larger grid and chassis self-return exclusion.
# SI units: m, rad, s. This profile is not calibrated against a physical robot.
map:
  resolution: 0.05
  width: 16.0
  height: 32.0
  origin_x: -8.0
  origin_y: -16.0
  prior: 0.5
sensor:
  p_hit: 0.70
  p_free: 0.35
  log_odds_min: -4.0
  log_odds_max: 4.0
  hit_thickness: 0.03
  # Gazebo produces chassis returns at 0.14--0.20 m. Never map the robot itself.
  min_range: 0.25
  max_range: 8.0
  max_beams: 180
  likelihood_beams: 60
  sigma_hit: 0.10
  z_hit: 0.95
  z_rand: 0.05
  likelihood_max_dist: 0.60
  likelihood_temperature: 1.0
  occupied_threshold: 0.65
motion:
  alpha1: 0.0001
  alpha2: 0.00001
  alpha3: 0.0001
  alpha4: 0.0001
filter:
  particles: 24
  seed: 7
  resample_ess_ratio: 0.5
  initial_x: 0.0
  initial_y: 0.0
  initial_yaw: 0.0
  initial_std_xy: 0.0
  initial_std_yaw: 0.0
update:
  min_translation: 0.08
  min_rotation: 0.06
  max_interval: 1.0
