# TP Parcial real-bag experiment, seed 7; not a general robot calibration.
map:
  resolution: 0.05
  width: 48.0
  height: 40.0
  origin_x: -16.0
  origin_y: -20.0
  prior: 0.5
sensor:
  p_hit: 0.75
  p_free: 0.4
  log_odds_min: -4.0
  log_odds_max: 4.0
  hit_thickness: 0.08
  min_range: 0.12
  max_range: 8.0
  max_beams: 180
  likelihood_beams: 60
  sigma_hit: 0.15
  z_hit: 0.95
  z_rand: 0.05
  likelihood_max_dist: 0.6
  likelihood_temperature: 1.0
  occupied_threshold: 0.65
motion:
  alpha1: 0.1
  alpha2: 0.01
  alpha3: 0.1
  alpha4: 0.1
filter:
  particles: 128
  seed: 7
  resample_ess_ratio: 0.5
  initial_x: 0.0
  initial_y: 0.0
  initial_yaw: 0.0
  initial_std_xy: 0.0
  initial_std_yaw: 0.0
update:
  min_translation: 0.08
  min_rotation: 0.06
  max_interval: 1.0
