# Robot real en el laboratorio. Unidades SI: m, rad, s.
# Los valores de sensor son los de slam/config/parcial_bag_scan_match.yaml, validados con el bag real.
sensor:
  min_range: 0.12
  max_range: 8.0
  likelihood_beams: 60
  sigma_hit: 0.15
  z_hit: 0.95
  z_rand: 0.05
  likelihood_max_dist: 0.60
  likelihood_temperature: 1.0
motion:
  alpha1: 0.02
  alpha2: 0.002
  alpha3: 0.02
  alpha4: 0.02
scan_match:
  enabled: false
localization:
  particles: 1000
  seed: 7
  resample_ess_ratio: 0.5
  min_translation: 0.08
  min_rotation: 0.06
  converged_std_xy: 0.10
  converged_std_yaw: 0.10
  unexplained_distance: 0.20
  lost_fraction: 0.25
  min_static_match_fraction: 0.50
  click_lost_fraction: 0.15
  burst_max_iterations: 30
  burst_stable_xy: 0.01
  burst_stable_yaw: 0.01
  burst_jitter_xy: 0.03
  burst_jitter_yaw: 0.02
  injection_enabled: true
  injection_alpha_slow: 0.001
  injection_alpha_fast: 0.1
  injection_max_fraction: 0.2
planner:
  # Radio del robot más margen: ninguna celda más cerca que eso de un obstáculo es transitable.
  robot_radius: 0.17
  safety_margin: 0.05
  clearance_distance: 0.50
  clearance_weight: 5.0
  start_snap_distance: 0.30
follower:
  lookahead: 0.40
  max_linear: 0.20
  max_angular: 0.80
  min_linear: 0.05
  slowdown_distance: 0.50
  align_start: 0.80
  align_done: 0.15
  rotate_gain: 1.5
  min_angular: 0.20
  goal_tolerance_xy: 0.08
  goal_tolerance_yaw: 0.05
navigator:
  stop_distance: 0.25
  stop_half_width: 0.20
  blocked_timeout: 15.0
  retry_period: 2.0
  lost_timeout: 10.0
  pose_timeout: 1.0
  scan_timeout: 1.0
obstacles:
  # Obstáculos que no están en el mapa (docs/decisiones/008).
  max_range: 3.0
  wall_distance: 0.20
  hits_to_mark: 3
